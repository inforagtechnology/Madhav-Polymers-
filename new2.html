<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .video-container {
  position: relative;
  width: 100%;
  height: 100vh;
  overflow: hidden;
}

.bg-slider {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -2;
}

.slide {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0;
  transition: opacity 1.5s ease-in-out;
}

.slide.active {
  opacity: 1;
}

.overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.5);
  z-index: -1;
}

.content {
  position: relative;
  z-index: 1;
}
  </style>
</head>
<body>
  <div class="video-container">
    <!-- Background Image Slider -->
    <div class="bg-slider">
      <img src="/assets/070f0743920cb865845fa38bef203b2d - Copy.jpg" class="slide active" alt="Door Seal 1">
      <img src="/assets/white.jpg" class="slide" alt="Window Seal 2">
      <img src="/assets/070f0743920cb865845fa38bef203b2d - Copy.jpg" class="slide" alt="Door Window Seal 3">
    </div>

    <!-- Dark Overlay -->
    <div class="overlay"></div>

    <!-- Text Layer -->
    <div class="content">
      <span class="subheading">BEST SEALING SOLUTIONS</span>
      <h1>India's Widest Seals<br>Product Manufacturer</h1>
      <div class="btn-group">
        <a href="#" class="btn btn-primary">Explore More</a>
        <a href="#" class="btn btn-secondary">Get Quote</a>
      </div>
    </div>
    <script>
  const slides = document.querySelectorAll('.bg-slider .slide');
  let current = 0;

  function nextSlide() {
    slides[current].classList.remove('active');
    current = (current + 1) % slides.length;
    slides[current].classList.add('active');
  }

  setInterval(nextSlide, 4000); // change image every 4 seconds
</script>
</div>
</body>
</html>
